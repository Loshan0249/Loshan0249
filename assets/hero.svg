<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Hello, I'm Loshan Mihisara. Cloud Computing Undergraduate, Aspiring Cloud and DevOps Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="80%" cy="40%" r="50%">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .fade { opacity: 0; animation: fade 0.6s ease forwards; }
    .l1 { animation-delay: 0.3s } .l2 { animation-delay: 0.9s } .l3 { animation-delay: 1.5s }
    .l4 { animation-delay: 2.1s } .l5 { animation-delay: 2.7s } .l6 { animation-delay: 3.3s }
    .blink { animation: blink 1s steps(1) infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
  </style>

  <rect width="1200" height="420" rx="16" fill="#0d1117"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid)" opacity="0.6"/>
  <rect width="1200" height="420" rx="16" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#30363d"/>

  <!-- top navigation -->
  <circle class="pulse" cx="48" cy="40" r="4" fill="#58a6ff"/>
  <text x="60" y="44" font-size="13" fill="#8b949e" letter-spacing="1">LOSHAN.MIHISARA</text>
  <circle class="pulse" cx="840" cy="40" r="4" fill="#3fb950"/>
  <text x="1160" y="44" font-size="12" fill="#8b949e" text-anchor="end">LK · UTC+05:30 · OPEN TO OPPORTUNITIES</text>

  <!-- hero -->
  <text x="48" y="104" font-size="15" fill="#58a6ff" letter-spacing="3">// HELLO WORLD, I'M</text>
  <text x="46" y="170" class="sans" font-size="64" font-weight="800" fill="url(#name)">Loshan</text>
  <text x="46" y="235" class="sans" font-size="64" font-weight="800" fill="url(#name)">Mihisara</text>

  <rect x="48" y="256" width="4" height="46" fill="#2f81f7"/>
  <text x="64" y="274" class="sans" font-size="17" font-weight="600" fill="#e6edf3">Cloud Computing Undergraduate | Aspiring Cloud &amp; DevOps Engineer</text>
  <text x="64" y="296" class="sans" font-size="13" fill="#8b949e">Cloud Infrastructure · Cybersecurity · Automation · Web Development</text>

  <!-- skill badges -->
  <g font-size="13" fill="#c9d1d9">
    <rect x="48" y="318" width="150" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="123" y="337" text-anchor="middle">Cloud Computing</text>
    <rect x="210" y="318" width="120" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="270" y="337" text-anchor="middle">Azure · AWS</text>
    <rect x="342" y="318" width="140" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="412" y="337" text-anchor="middle">Docker · Linux</text>
  </g>

  <!-- left bottom text -->
  <text x="48" y="376" font-size="14" fill="#58a6ff">▸ <tspan fill="#c9d1d9">Building cloud-powered solutions</tspan></text>
  <text x="48" y="398" font-size="14" fill="#58a6ff">▸ <tspan fill="#c9d1d9">Exploring cybersecurity &amp; DevOps</tspan></text>

  <!-- terminal -->
  <g transform="translate(630 70)">
    <rect width="540" height="326" rx="10" fill="#010409" stroke="#30363d"/>
    <rect width="540" height="30" rx="10" fill="#161b22"/>
    <rect y="20" width="540" height="10" fill="#161b22"/>
    <circle cx="20" cy="15" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="15" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="15" r="5" fill="#27c93f"/>
    <text x="270" y="19" font-size="11" fill="#6e7681" text-anchor="middle">~/loshan — zsh</text>

    <g font-size="13">
      <g class="fade l1"><text x="20" y="62" fill="#3fb950">$</text><text x="36" y="62" fill="#e6edf3">whoami</text></g>
      <g class="fade l2" fill="#58a6ff">
        <text x="20" y="84">loshan — builds cloud-powered solutions and</text>
        <text x="20" y="102">explores modern technologies</text>
      </g>

      <g class="fade l3"><text x="20" y="132" fill="#3fb950">$</text><text x="36" y="132" fill="#e6edf3">cat tech_stack.json</text></g>
      <g class="fade l4" fill="#e6edf3">
        <text x="20" y="154">{</text>
        <text x="20" y="174">  <tspan fill="#79c0ff">"cloud"</tspan>: [<tspan fill="#a5d6ff">"Azure"</tspan>, <tspan fill="#a5d6ff">"AWS"</tspan>],</text>
        <text x="20" y="194">  <tspan fill="#79c0ff">"devops"</tspan>: [<tspan fill="#a5d6ff">"Docker"</tspan>, <tspan fill="#a5d6ff">"Linux"</tspan>, <tspan fill="#a5d6ff">"CI/CD"</tspan>],</text>
        <text x="20" y="214">  <tspan fill="#79c0ff">"security"</tspan>: [<tspan fill="#a5d6ff">"Vulnerability Scanning"</tspan>, <tspan fill="#a5d6ff">"SIEM"</tspan>],</text>
        <text x="20" y="234">  <tspan fill="#79c0ff">"development"</tspan>: [<tspan fill="#a5d6ff">"Python"</tspan>, <tspan fill="#a5d6ff">"Web Development"</tspan>]</text>
        <text x="20" y="254">}</text>
      </g>

      <g class="fade l5"><text x="20" y="284" fill="#3fb950">$</text><text x="36" y="284" fill="#e6edf3">./hire --connect</text></g>
      <g class="fade l6">
        <text x="20" y="306" fill="#58a6ff">&gt; ready to collaborate · let's build something great</text>
        <rect class="blink" x="432" y="294" width="8" height="15" fill="#58a6ff"/>
      </g>
    </g>
  </g>
</svg>
