<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070b18;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1526;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8C5A;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1e35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#081020;stop-opacity:1" />
    </linearGradient>
    <filter id="blueGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1a2a4a" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#dots)" opacity="0.6"/>
  <rect x="48" y="70" width="4" height="160" fill="url(#accentLine)" rx="2"/>
  <text x="72" y="130" font-family="'Courier New', 'Consolas', monospace" font-weight="700" font-size="42" fill="#FFFFFF" letter-spacing="4">LOSHAN MIHISARA</text>
  <text x="74" y="168" font-family="'Courier New', 'Consolas', monospace" font-weight="400" font-size="18" fill="#00D4FF" letter-spacing="2" filter="url(#blueGlow)">Cloud Computing Undergraduate</text>
  <text x="74" y="200" font-family="'Courier New', 'Consolas', monospace" font-size="13" fill="#FF6B35" letter-spacing="1">Cloud Infrastructure  ·  DevOps  ·  Cybersecurity  ·  Automation</text>
  <text x="74" y="226" font-family="'Courier New', 'Consolas', monospace" font-size="12" fill="#4a6080" letter-spacing="1">SLTC Research University · Sri Lanka</text>
  <rect x="640" y="55" width="510" height="190" rx="10" fill="url(#termGrad)" stroke="#1a3050" stroke-width="1.5"/>
  <rect x="640" y="55" width="510" height="32" rx="10" fill="#0f1a2e"/>
  <rect x="640" y="71" width="510" height="16" fill="#0f1a2e"/>
  <circle cx="664" cy="71" r="6" fill="#FF5F57"/>
  <circle cx="684" cy="71" r="6" fill="#FFBD2E"/>
  <circle cx="704" cy="71" r="6" fill="#28C840"/>
  <text x="862" y="76" font-family="'Courier New', monospace" font-size="12" fill="#4a6080" text-anchor="middle">bash — loshan@cloud</text>
  <text x="660" y="118" font-family="'Courier New', 'Consolas', monospace" font-size="13" fill="#00D4FF">loshan@cloud-dev:~$</text>
  <text x="796" y="118" font-family="'Courier New', 'Consolas', monospace" font-size="13" fill="#E0E0E0"> cloud init --engineer</text>
  <text x="660" y="140" font-family="'Courier New', 'Consolas', monospace" font-size="12" fill="#4a6080">→ Initializing cloud environment...</text>
  <text x="660" y="162" font-family="'Courier New', 'Consolas', monospace" font-size="12" fill="#28C840">✔ Azure    connected</text>
  <text x="660" y="180" font-family="'Courier New', 'Consolas', monospace" font-size="12" fill="#28C840">✔ Docker   running</text>
  <text x="660" y="198" font-family="'Courier New', 'Consolas', monospace" font-size="12" fill="#28C840">✔ CI/CD    active</text>
  <text x="660" y="218" font-family="'Courier New', 'Consolas', monospace" font-size="12" fill="#FF6B35">▋</text>
  <rect x="0" y="295" width="1200" height="3" fill="url(#accentLine)" opacity="0.6"/>
  <rect x="0" y="0" width="1200" height="2" fill="#00D4FF" opacity="0.3"/>
</svg>
