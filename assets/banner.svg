<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070b18;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1526;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%"  style="stop-color:#FF8C5A;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#0f1e35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#081020;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#00D4FF;stop-opacity:0" />
      <stop offset="50%"  style="stop-color:#00D4FF;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:0" />
    </linearGradient>
    <filter id="blueGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="orangeGlow" x="-200%" y="-20%" width="500%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1a2a4a" opacity="0.5"/>
    </pattern>
    <clipPath id="termClip">
      <rect x="640" y="55" width="510" height="190" rx="10"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#dots)" opacity="0.6"/>

  <!-- Animated scan line sweeping across banner -->
  <rect x="-300" y="0" width="300" height="300" fill="url(#scanGrad)" opacity="0.9">
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="1500 0" dur="4s" repeatCount="indefinite" calcMode="linear"/>
  </rect>

  <!-- Top edge glow -->
  <rect x="0" y="0" width="1200" height="2" fill="#00D4FF" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Left accent bar drawing in -->
  <rect x="48" y="70" width="4" height="0" fill="url(#accentLine)" rx="2" filter="url(#orangeGlow)">
    <animate attributeName="height" from="0" to="160" dur="0.6s" begin="0.2s" fill="freeze" calcMode="easeOut"/>
  </rect>

  <!-- NAME -->
  <text x="72" y="130"
    font-family="'Courier New', 'Consolas', monospace"
    font-weight="700" font-size="42" fill="#FFFFFF" letter-spacing="4" opacity="0">LOSHAN MIHISARA
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.6s" fill="freeze"/>
  </text>

  <!-- Name underline sweep -->
  <rect x="72" y="136" width="0" height="1.5" fill="#FF6B35" opacity="0.5">
    <animate attributeName="width" from="0" to="430" dur="0.7s" begin="1.2s" fill="freeze" calcMode="easeOut"/>
  </rect>

  <!-- SUBTITLE with glow + pulse -->
  <text x="74" y="168"
    font-family="'Courier New', 'Consolas', monospace"
    font-weight="400" font-size="18" fill="#00D4FF" letter-spacing="2"
    filter="url(#blueGlow)" opacity="0">Cloud Computing Undergraduate
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.1s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="3s" begin="2s" repeatCount="indefinite"/>
  </text>

  <!-- TAGLINE -->
  <text x="74" y="200"
    font-family="'Courier New', 'Consolas', monospace"
    font-size="13" fill="#FF6B35" letter-spacing="1" opacity="0">Cloud Infrastructure  ·  DevOps  ·  Cybersecurity  ·  Automation
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.5s" fill="freeze"/>
  </text>

  <!-- INSTITUTION -->
  <text x="74" y="226"
    font-family="'Courier New', 'Consolas', monospace"
    font-size="12" fill="#4a6080" letter-spacing="1" opacity="0">SLTC Research University · Sri Lanka
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.9s" fill="freeze"/>
  </text>

  <!-- Terminal window body -->
  <rect x="640" y="55" width="510" height="190" rx="10"
    fill="url(#termGrad)" stroke="#1a3050" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.4s" fill="freeze"/>
  </rect>
  <rect x="640" y="55" width="510" height="32" rx="10" fill="#0f1a2e" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.4s" fill="freeze"/>
  </rect>
  <rect x="640" y="71" width="510" height="16" fill="#0f1a2e" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.4s" fill="freeze"/>
  </rect>

  <!-- Traffic light buttons -->
  <circle cx="664" cy="71" r="6" fill="#FF5F57" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.6s" fill="freeze"/>
  </circle>
  <circle cx="684" cy="71" r="6" fill="#FFBD2E" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.7s" fill="freeze"/>
  </circle>
  <circle cx="704" cy="71" r="6" fill="#28C840" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.8s" fill="freeze"/>
  </circle>

  <!-- Terminal title -->
  <text x="862" y="76"
    font-family="'Courier New', monospace" font-size="12" fill="#4a6080" text-anchor="middle" opacity="0">bash — loshan@cloud
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
  </text>

  <!-- Terminal internal scan line -->
  <rect x="640" y="87" width="510" height="20" fill="url(#scanGrad)" clip-path="url(#termClip)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="0 160" dur="2.5s" begin="1s" repeatCount="indefinite" calcMode="linear"/>
  </rect>

  <!-- Terminal line 1: prompt -->
  <text x="660" y="118"
    font-family="'Courier New', 'Consolas', monospace" font-size="13" fill="#00D4FF" opacity="0">loshan@cloud-dev:~$
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="1.4s" fill="freeze"/>
  </text>
  <text x="796" y="118"
    font-family="'Courier New', 'Consolas', monospace" font-size="13" fill="#E0E0E0" opacity="0"> cloud init --engineer
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="1.8s" fill="freeze"/>
  </text>

  <!-- Terminal line 2 -->
  <text x="660" y="140"
    font-family="'Courier New', 'Consolas', monospace" font-size="12" fill="#4a6080" opacity="0">→ Initializing cloud environment...
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="2.1s" fill="freeze"/>
  </text>

  <!-- Terminal line 3 -->
  <text x="660" y="162"
    font-family="'Courier New', 'Consolas', monospace" font-size="12" fill="#28C840" opacity="0">✔ Azure    connected
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="2.5s" fill="freeze"/>
  </text>

  <!-- Terminal line 4 -->
  <text x="660" y="180"
    font-family="'Courier New', 'Consolas', monospace" font-size="12" fill="#28C840" opacity="0">✔ Docker   running
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="2.9s" fill="freeze"/>
  </text>

  <!-- Terminal line 5 -->
  <text x="660" y="198"
    font-family="'Courier New', 'Consolas', monospace" font-size="12" fill="#28C840" opacity="0">✔ CI/CD    active
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="3.3s" fill="freeze"/>
  </text>

  <!-- Blinking cursor -->
  <text x="660" y="218"
    font-family="'Courier New', 'Consolas', monospace" font-size="13" fill="#FF6B35" opacity="0">▋
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="3.6s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.6s" repeatCount="indefinite"/>
  </text>

  <!-- Bottom accent line drawing in -->
  <rect x="0" y="295" width="0" height="3" fill="url(#accentLine)" opacity="0.7">
    <animate attributeName="width" from="0" to="1200" dur="1s" begin="0.3s" fill="freeze" calcMode="easeOut"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" begin="1.3s" repeatCount="indefinite"/>
  </rect>

</svg>
