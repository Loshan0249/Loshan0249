<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="Section divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FF6B35" stop-opacity="0"/><stop offset="0.3" stop-color="#FF6B35"/><stop offset="0.7" stop-color="#00D4FF"/><stop offset="1" stop-color="#00D4FF" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    @keyframes run{from{transform:translateX(-120px)}to{transform:translateX(1320px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    .run{animation:run 4s linear infinite}
    .dia{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
    .p{animation:pulse 2s ease-in-out infinite}
  </style>
  <rect x="0" y="11" width="1200" height="2" fill="url(#g)" opacity="0.55"/>
  <rect class="run" x="0" y="10" width="120" height="4" rx="2" fill="url(#g)"/>
  <rect class="dia p" x="594" y="6" width="12" height="12" fill="#0d1117" stroke="#00D4FF" stroke-width="1.5"/>
  <circle class="p" cx="600" cy="12" r="2" fill="#FF6B35"/>
</svg>
