<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="Animated delivery pipeline: commit, build, test, review, merge, deploy, live" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .runner { animation: run 10s linear infinite; }
    .progress { animation: grow 10s linear infinite; transform-origin: 90px 88px; }
    .blink { animation: blink 1s steps(1) infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes run { 0% { transform: translateX(0); } 90%,100% { transform: translateX(1020px); } }
    @keyframes grow { 0% { transform: scaleX(0); } 90%,100% { transform: scaleX(1); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    @keyframes n0 { 0%,0% { fill:#161b22; stroke:#30363d; } 0.0%,96% { fill:#0c2d6b; stroke:#58a6ff; } 100% { fill:#161b22; stroke:#30363d; } }
    @keyframes t0 { 0%,0% { fill:#6e7681; } 0.0%,96% { fill:#e6edf3; } 100% { fill:#6e7681; } }
    @keyframes r0 { 0%,0% { opacity:0; r:16; } 0.0% { opacity:.7; r:16; } 6.0%,100% { opacity:0; r:30; } }
    .n0 { animation: n0 10s linear infinite; } .t0 { animation: t0 10s linear infinite; } .r0 { animation: r0 10s linear infinite; }
    @keyframes n1 { 0%,14.5% { fill:#161b22; stroke:#30363d; } 15.0%,96% { fill:#0c2d6b; stroke:#58a6ff; } 100% { fill:#161b22; stroke:#30363d; } }
    @keyframes t1 { 0%,14.5% { fill:#6e7681; } 15.0%,96% { fill:#e6edf3; } 100% { fill:#6e7681; } }
    @keyframes r1 { 0%,14.5% { opacity:0; r:16; } 15.0% { opacity:.7; r:16; } 21.0%,100% { opacity:0; r:30; } }
    .n1 { animation: n1 10s linear infinite; } .t1 { animation: t1 10s linear infinite; } .r1 { animation: r1 10s linear infinite; }
    @keyframes n2 { 0%,29.5% { fill:#161b22; stroke:#30363d; } 30.0%,96% { fill:#0c2d6b; stroke:#58a6ff; } 100% { fill:#161b22; stroke:#30363d; } }
    @keyframes t2 { 0%,29.5% { fill:#6e7681; } 30.0%,96% { fill:#e6edf3; } 100% { fill:#6e7681; } }
    @keyframes r2 { 0%,29.5% { opacity:0; r:16; } 30.0% { opacity:.7; r:16; } 36.0%,100% { opacity:0; r:30; } }
    .n2 { animation: n2 10s linear infinite; } .t2 { animation: t2 10s linear infinite; } .r2 { animation: r2 10s linear infinite; }
    @keyframes n3 { 0%,44.5% { fill:#161b22; stroke:#30363d; } 45.0%,96% { fill:#0c2d6b; stroke:#58a6ff; } 100% { fill:#161b22; stroke:#30363d; } }
    @keyframes t3 { 0%,44.5% { fill:#6e7681; } 45.0%,96% { fill:#e6edf3; } 100% { fill:#6e7681; } }
    @keyframes r3 { 0%,44.5% { opacity:0; r:16; } 45.0% { opacity:.7; r:16; } 51.0%,100% { opacity:0; r:30; } }
    .n3 { animation: n3 10s linear infinite; } .t3 { animation: t3 10s linear infinite; } .r3 { animation: r3 10s linear infinite; }
    @keyframes n4 { 0%,59.5% { fill:#161b22; stroke:#30363d; } 60.0%,96% { fill:#0c2d6b; stroke:#58a6ff; } 100% { fill:#161b22; stroke:#30363d; } }
    @keyframes t4 { 0%,59.5% { fill:#6e7681; } 60.0%,96% { fill:#e6edf3; } 100% { fill:#6e7681; } }
    @keyframes r4 { 0%,59.5% { opacity:0; r:16; } 60.0% { opacity:.7; r:16; } 66.0%,100% { opacity:0; r:30; } }
    .n4 { animation: n4 10s linear infinite; } .t4 { animation: t4 10s linear infinite; } .r4 { animation: r4 10s linear infinite; }
    @keyframes n5 { 0%,74.5% { fill:#161b22; stroke:#30363d; } 75.0%,96% { fill:#0c2d6b; stroke:#58a6ff; } 100% { fill:#161b22; stroke:#30363d; } }
    @keyframes t5 { 0%,74.5% { fill:#6e7681; } 75.0%,96% { fill:#e6edf3; } 100% { fill:#6e7681; } }
    @keyframes r5 { 0%,74.5% { opacity:0; r:16; } 75.0% { opacity:.7; r:16; } 81.0%,100% { opacity:0; r:30; } }
    .n5 { animation: n5 10s linear infinite; } .t5 { animation: t5 10s linear infinite; } .r5 { animation: r5 10s linear infinite; }
    @keyframes n6 { 0%,89.5% { fill:#161b22; stroke:#30363d; } 90.0%,96% { fill:#0f3d1e; stroke:#3fb950; } 100% { fill:#161b22; stroke:#30363d; } }
    @keyframes t6 { 0%,89.5% { fill:#6e7681; } 90.0%,96% { fill:#e6edf3; } 100% { fill:#6e7681; } }
    @keyframes r6 { 0%,89.5% { opacity:0; r:16; } 90.0% { opacity:.7; r:16; } 96.0%,100% { opacity:0; r:30; } }
    .n6 { animation: n6 10s linear infinite; } .t6 { animation: t6 10s linear infinite; } .r6 { animation: r6 10s linear infinite; }
  </style>

  <rect width="1200" height="180" rx="14" fill="#0d1117"/>
  <rect width="1200" height="180" rx="14" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="178" rx="13" fill="none" stroke="#30363d"/>

  <!-- header -->
  <circle class="pulse" cx="34" cy="28" r="4" fill="#3fb950"/>
  <text x="46" y="32" font-size="12" fill="#8b949e" letter-spacing="1">DELIVERY PIPELINE</text>
  <rect x="190" y="17" width="64" height="22" rx="11" fill="#161b22" stroke="#30363d"/>
  <text x="222" y="32" font-size="11" fill="#c9d1d9" text-anchor="middle">⎇ main</text>
  <text x="1166" y="32" font-size="12" fill="#8b949e" text-anchor="end">git commit -m "ship it"<tspan class="blink" fill="#58a6ff"> ▌</tspan></text>
  <line x1="24" y1="48" x2="1176" y2="48" stroke="#21262d"/>

  <!-- track -->
  <rect x="90" y="86" width="1020" height="4" rx="2" fill="#21262d"/>
  <rect class="progress" x="90" y="86" width="1020" height="4" rx="2" fill="url(#bar)"/>

  <!-- stations -->
  <g>
    <circle class="r0" cx="90" cy="88" r="16" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0"/>
    <circle class="n0" cx="90" cy="88" r="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="90" y="92" font-size="11" font-weight="700" text-anchor="middle" fill="#58a6ff">01</text>
    <text class="t0" x="90" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6e7681">Commit</text>
    <text x="90" y="146" font-size="11" text-anchor="middle" fill="#6e7681">git commit</text>
  </g>
  <g>
    <circle class="r1" cx="260" cy="88" r="16" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0"/>
    <circle class="n1" cx="260" cy="88" r="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="260" y="92" font-size="11" font-weight="700" text-anchor="middle" fill="#58a6ff">02</text>
    <text class="t1" x="260" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6e7681">Build</text>
    <text x="260" y="146" font-size="11" text-anchor="middle" fill="#6e7681">docker build</text>
  </g>
  <g>
    <circle class="r2" cx="430" cy="88" r="16" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0"/>
    <circle class="n2" cx="430" cy="88" r="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="430" y="92" font-size="11" font-weight="700" text-anchor="middle" fill="#58a6ff">03</text>
    <text class="t2" x="430" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6e7681">Test</text>
    <text x="430" y="146" font-size="11" text-anchor="middle" fill="#6e7681">run checks</text>
  </g>
  <g>
    <circle class="r3" cx="600" cy="88" r="16" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0"/>
    <circle class="n3" cx="600" cy="88" r="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="600" y="92" font-size="11" font-weight="700" text-anchor="middle" fill="#58a6ff">04</text>
    <text class="t3" x="600" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6e7681">Review</text>
    <text x="600" y="146" font-size="11" text-anchor="middle" fill="#6e7681">pull request</text>
  </g>
  <g>
    <circle class="r4" cx="770" cy="88" r="16" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0"/>
    <circle class="n4" cx="770" cy="88" r="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="770" y="92" font-size="11" font-weight="700" text-anchor="middle" fill="#58a6ff">05</text>
    <text class="t4" x="770" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6e7681">Merge</text>
    <text x="770" y="146" font-size="11" text-anchor="middle" fill="#6e7681">git merge main</text>
  </g>
  <g>
    <circle class="r5" cx="940" cy="88" r="16" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0"/>
    <circle class="n5" cx="940" cy="88" r="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="940" y="92" font-size="11" font-weight="700" text-anchor="middle" fill="#58a6ff">06</text>
    <text class="t5" x="940" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6e7681">Deploy</text>
    <text x="940" y="146" font-size="11" text-anchor="middle" fill="#6e7681">ci/cd pipeline</text>
  </g>
  <g>
    <circle class="r6" cx="1110" cy="88" r="16" fill="none" stroke="#3fb950" stroke-width="2" opacity="0"/>
    <circle class="n6" cx="1110" cy="88" r="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="1110" y="92" font-size="11" font-weight="700" text-anchor="middle" fill="#3fb950">07</text>
    <text class="t6" x="1110" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6e7681">Live</text>
    <text x="1110" y="146" font-size="11" text-anchor="middle" fill="#6e7681">production</text>
  </g>

  <!-- runner -->
  <g class="runner">
    <circle cx="90" cy="88" r="12" fill="#58a6ff" filter="url(#soft)" opacity="0.8"/>
    <circle cx="90" cy="88" r="5" fill="#ffffff"/>
    <rect x="62" y="44" width="56" height="18" rx="9" fill="#0c2d6b" stroke="#2f81f7"/>
    <text x="90" y="57" font-size="10" fill="#79c0ff" text-anchor="middle">a1b2c3d</text>
  </g>
</svg>
